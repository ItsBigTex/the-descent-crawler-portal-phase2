<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Descent // Crawler Portal</title><link rel="stylesheet" href="./css/dungeon.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body><main class="shell"><header class="top"><div><div class="brand"><b>THE DESCENT</b> // CRAWLER PORTAL</div><div class="tag">DUNGEON CRAWLER WORLD // EARTH</div></div><a class="btn" href="./gm.html">GM ACCESS</a></header><section style="padding:38px 0 20px"><div class="tag red">SYSTEM NOTICE</div><h1>IDENTIFY YOURSELF,<br>CRAWLER.</h1><p class="muted">Select your crawler file. Phase 1 stores changes on this device only.</p></section><section id="cards" class="grid"></section><div class="footer">THE DESCENT // PHASE 1 LOCAL HUD // NO CLOUD SYNC</div></main><script src="./js/crawler-data.js"></script><script src="./js/supabase-config.js"></script>

<script src="./js/app.js"></script><script>getState().then(s=>{document.querySelector('#cards').innerHTML=s.crawlers.map(c=>`<a class="panel crawler" href="./character.html?id=${c.id}"><div class="tag">CRAWLER FILE // ${c.id.toUpperCase()}</div><h2>${esc(c.name)}</h2><div class="red system">${esc(c.systemTitle)}</div><p class="muted">LEVEL ${c.level} // FLOOR ${c.floor}</p></a>`).join('')}).catch(e=>document.querySelector('#cards').innerHTML=`<div class="notice">${esc(e.message)}. Serve this repository through GitHub Pages or a local web server; opening index.html directly may block JSON loading.</div>`)</script></body></html>
