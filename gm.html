<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GM Console // The Descent</title>
<link rel="stylesheet" href="./css/dungeon.css?v=4.4.1"><link rel="stylesheet" href="./css/gm-console.css?v=4.4.1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><main class="shell gm-shell">
<header class="top gm-top"><a class="btn" href="./index.html">← PLAYER PORTAL</a>
<div><div class="brand"><b>GM EYES ONLY</b> // DUNGEON CONTROL</div><div class="tag">PHASE 4.3 // DUNGEON PRESENTATION ENGINE</div></div>
<div class="controls"><span class="pill" id="gmClock">SYSTEM ONLINE</span><button class="btn" onclick="signOutDescent()">SIGN OUT</button></div></header>

<section class="gm-commandbar">
<div><span class="tag">PARTY STATUS</span><b id="partySummary">LOADING...</b></div>
<div><span class="tag">ACTIVE ENCOUNTER</span><b id="encounterSummary">NONE</b></div>
<div><span class="tag">CONTENT LIBRARY</span><b id="librarySummary">0 RECORDS</b></div>
</section>

<nav class="gm-workspaces" id="workspaceNav">
<button data-workspace="dashboard" class="active">DASHBOARD</button>
<button data-workspace="session">LIVE SESSION</button>
<button data-workspace="director">DUNGEON DIRECTOR</button>
<button data-workspace="foundry">FOUNDRY BRIDGE</button>
<button data-workspace="ai">AI CONTENT STUDIO</button>
<button data-workspace="actions">GM ACTIONS</button>
<button data-workspace="rewards">QUESTS + REWARDS</button>
<button data-workspace="items">ITEMS</button>
<button data-workspace="npcs">NPCs</button>
<button data-workspace="adversaries">ADVERSARIES</button>
<button data-workspace="encounters">ENCOUNTERS</button>
<button data-workspace="tables">TABLES</button>
</nav>

<section id="workspace"></section>
<div class="footer">THE DESCENT // GM CONSOLE // RAW RULES AUTHORITY: CORE RULEBOOK + GM TOOLKIT</div>
</main>
<script src="./js/crawler-data.js?v=4.4.1"></script><script src="./js/supabase-config.js?v=4.4.1"></script>
<script src="./js/cloud-state.js?v=4.4.1"></script><script src="./js/app.js?v=4.4.1"></script><script src="./js/foundry-bridge.js?v=4.4.1"></script><script src="./js/gm.js?v=4.4.1"></script></body></html>
